<!DOCTYPE html>

<head>
<style>
    
    body{
        background-color:#F3F4F6;
        color:var(--text-color);
    }
    .header{
        position: fixed;
        width: 80%;
        top: 0;
        left: 0;
        padding:2rem 12%;
        background:rgba(0, 0, 0, 0.315);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-between;
        align-item: center;
        z-index: 1000;
    }
    #menu-icon{
        fon-size: 3.5rem;
        color: var(--main-color);
        display: none;
    }
    .logo{
        font-size: 2rem;
        text-decoration: none;
        color: var(--text-color);
        font-weight:800;
        cursor: pointer;
        transition: 0.3s ease-in-out;
    }
    .logo:hover{
        transform: scale(1.1);
    }
    span{
        background: linear-gradient(
            270deg,
            #470047 50%
        );
        background-clip: text;
        color: transparent;
    }
    .navbar a{
        font-size: 1.8rem;
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        text-decoration: none ;
        color: var(--text-color);
        margin-left:4rem;
        font-weight: 500;
        transition:0.3s ease-in-out;
        border-bottom:3px solid transparent;
    }
    .navbar a:hover{
        color:var(--main-color);
        border-bottom: 3px solid var (--main-color);
    }
    .gradient-btn{
        font-size: 1.2rem;
        padding:1rem 2rem;
        boarder-radius:3rem;
        background: linear-gradient(
            270deg,
            #470047 50%
        );
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.3s ease-in-out;
        color: white;
        border: none;
        border-radius: 10%;
        text-wrap: nowrap;
    }
    .gradient-btn:hover{
        transform:scale(1.05);
    }
</style>
</head>
<body>
    <header class="header">
        <a href="#home" class="logo">
            Aliff <span>Shahbil</span>

        </a>

        <i class="bx bx-menu" id="menu-icon"></i>

        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#Projects">Projects</a>
            <a href="#Aboutme">About Me</a>
            <a href="#Contact">Contact</a>
        </nav>

        <button class="gradient-btn">Contact Me</button>


    </header>
    <script src="script.js"></script>


</body>
